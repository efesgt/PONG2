<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🍻 Beer Pong Turnuvası 🍻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Patrick+Hand+SC&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="config.js"></script>
<style>
  :root{
    --chalk:#f6f3ea; --chalk-dim:rgba(246,243,234,.6);
    --yellow:#ffd84d; --pink:#ff7eb6; --cyan:#5ee0ff; --green:#7dffa6;
    --orange:#ffa05c; --purple:#b99aff; --danger:#ff7a7a; --ok:#8dffae;
    --t-red:#ff6464; --t-blue:#58a9ff; --t-white:#ffffff;
    --font:'Patrick Hand','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#0d1112;color:var(--chalk);font-family:var(--font);font-size:19px;line-height:1.25}
  button,input,select{font-family:inherit}

  /* Çerçeve + tahta */
  .frame{max-width:1500px;margin:14px auto;padding:14px;background:#15181a;border-radius:10px;box-shadow:0 10px 40px #000a, 0 0 0 2px #2a2f33}
  .board{
    background:
      radial-gradient(900px 480px at 12% -10%, rgba(255,126,182,.20), transparent 62%),
      radial-gradient(900px 480px at 96% 0%, rgba(94,224,255,.18), transparent 62%),
      radial-gradient(800px 500px at 50% 110%, rgba(255,216,77,.10), transparent 60%),
      linear-gradient(160deg,#28524b,#20403b 60%,#1b3733);
    padding:26px 28px 32px;border-radius:4px}

  /* Başlık */
  .top{text-align:center;margin-bottom:24px}
  h1{font-family:var(--font);font-weight:400;font-size:clamp(28px,6.2vw,60px);margin:0;display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.3em;padding:0 12px 12px;position:relative;line-height:1.1}
  h1 .grad{background:linear-gradient(90deg,var(--yellow),var(--pink) 50%,var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;letter-spacing:.03em}
  h1::after{content:"";position:absolute;left:3%;right:3%;bottom:0;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--yellow),var(--pink),var(--cyan),var(--green));filter:url(#rough)}
  .conn{margin-top:10px;font-size:16px;color:var(--chalk-dim)}
  .conn.supabase{color:var(--ok)}
  .conn.local{color:var(--yellow)}

  h2{font-family:var(--font);font-weight:400;font-size:27px;letter-spacing:.03em;margin:0 0 10px;color:var(--pc)}
  h2 small{font-size:20px;color:var(--chalk-dim);letter-spacing:0}

  .panel{--pc:var(--chalk-dim);border:2px solid var(--pc);border-radius:14px 10px 16px 9px/10px 15px 9px 14px;padding:16px 18px;background:rgba(0,0,0,.12)}
  .p-teams{--pc:var(--pink)} .p-tables{--pc:var(--yellow)} .p-board{--pc:var(--cyan)}
  .layout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:22px;align-items:start}
  #tablesSection{margin-bottom:22px}

  /* Form */
  .form{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:end}
  .form .btn{grid-column:1/-1}
  label{display:grid;gap:4px;font-size:16px;color:var(--chalk-dim)}
  input,select{font-size:20px;color:var(--chalk);background:rgba(0,0,0,.28);border:2px solid rgba(255,126,182,.55);border-radius:10px;padding:8px 10px;width:100%;min-height:44px}
  input:focus,select:focus{outline:none;border-color:var(--yellow)}
  input:disabled{opacity:.45}
  select{border-color:rgba(94,224,255,.6)}
  select option{color:#111}
  .msg{min-height:22px;margin:8px 0 0;font-size:17px;color:var(--danger)}
  .note{margin:6px 0 0;font-size:16px;color:var(--chalk-dim)}

  /* Butonlar */
  .btn{font-size:20px;cursor:pointer;color:var(--chalk);background:transparent;border:2px solid var(--chalk);border-radius:12px 8px 13px 9px/9px 13px 8px 12px;padding:8px 16px;min-height:44px}
  .btn:hover{background:rgba(255,255,255,.1)}
  .btn.primary{background:var(--yellow);border-color:var(--yellow);color:#2b2300}
  .btn.primary:hover{background:#ffe88a}
  .btn.alt{border-color:var(--cyan);color:var(--cyan)}
  .btn.alt:hover{background:rgba(94,224,255,.14)}
  .btn.pink{border-color:var(--pink);color:var(--pink)}
  .btn.danger{border-color:var(--danger);color:var(--danger)}
  .btn.danger.solid{background:var(--danger);color:#2b1111}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:focus-visible,.side:focus-visible,.trash:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

  /* Zorluk rozeti: yeşil (kolay) → kırmızı (zor) */
  .lvl{--hue:calc(135 - (var(--lv) - 1) * 14.5);display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border:2px solid hsl(var(--hue) 90% 60%);border-radius:999px;font-size:16px;line-height:1;color:hsl(var(--hue) 100% 80%);background:hsl(var(--hue) 70% 30% / .5);flex:none;white-space:nowrap}
  .lvl.sm{min-width:26px;height:26px;font-size:15px;padding:0 5px}
  .lvl.full{padding:0 11px;font-size:15px}

  /* Takım listesi */
  .teams{list-style:none;margin:14px 0 0;padding:0;max-height:540px;overflow:auto}
  .teams li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:4px 0 4px 2px;border-bottom:2px dotted rgba(246,243,234,.22)}
  .teams li.empty{display:block;color:var(--chalk-dim);border:0;padding:8px 0}
  .teams li.out .tn{opacity:.5;text-decoration:line-through}
  .tn{overflow-wrap:anywhere}
  .chip{display:inline-block;margin-left:8px;padding:0 8px;border:1.5px solid var(--chalk-dim);border-radius:999px;font-size:13px;color:var(--chalk-dim);vertical-align:middle;white-space:nowrap}
  .chip.play{border-color:var(--yellow);color:var(--yellow)}
  .chip.wait{border-color:var(--cyan);color:var(--cyan)}
  .chip.adv{border-color:var(--ok);color:var(--ok)}
  .chip.champ{border-color:var(--yellow);color:#2b2300;background:var(--yellow)}
  .trash{background:none;border:0;color:var(--chalk-dim);cursor:pointer;padding:10px;border-radius:10px;display:grid;place-items:center}
  .trash:hover{color:var(--danger);background:rgba(255,122,122,.16)}
  .trash svg{width:22px;height:22px}

  #controls{margin-top:16px;display:grid;gap:10px}
  .hint{margin:0;font-size:16px;color:var(--chalk-dim)}

  /* Masalar */
  .tables{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .tcard{--tc:var(--chalk);border:3px solid var(--tc);border-radius:16px 11px 17px 12px/12px 17px 11px 16px;padding:12px 14px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 14%,transparent),rgba(0,0,0,.14));min-height:150px}
  .tcard.kirmizi{--tc:var(--t-red)} .tcard.mavi{--tc:var(--t-blue)} .tcard.beyaz{--tc:var(--t-white)}
  .thead{font-size:27px;letter-spacing:.04em;color:var(--tc);display:flex;align-items:center;gap:10px}
  .swatch{width:16px;height:16px;border-radius:50%;background:var(--tc);flex:none;box-shadow:0 0 10px var(--tc)}
  .tmeta{font-size:15px;color:var(--chalk-dim);margin-top:2px}
  .vs{display:grid;gap:4px;margin-top:8px}
  .side{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:22px;color:var(--chalk);background:rgba(255,255,255,.08);border:2px solid var(--chalk-dim);border-radius:12px;padding:8px 12px;cursor:pointer;min-height:52px;text-align:left;width:100%}
  .side:hover{border-color:var(--tc);background:rgba(255,255,255,.16)}
  .side .nm{overflow-wrap:anywhere}
  .vsmark{text-align:center;color:var(--chalk-dim);font-size:14px;letter-spacing:.3em}
  .tempty{margin-top:18px;color:var(--chalk-dim);font-size:20px}
  .tcard .hint{margin-top:8px;font-size:14px}
  .queue{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:17px;color:var(--chalk-dim)}
  .queue .lab{color:var(--yellow)}
  .qchip{display:inline-flex;align-items:center;gap:6px;border:2px dashed var(--chalk-dim);border-radius:999px;padding:3px 12px;color:var(--chalk)}
  .qchip.wait{border-color:var(--cyan)}

  /* Turnuva tablosu */
  .bracketPanel{min-width:0}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
  .barmsg{flex:1 1 220px;font-size:17px;color:var(--yellow)}
  .legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 8px;font-size:15px;color:var(--chalk-dim)}
  .scrollhint{display:none;margin:0 0 6px;font-size:15px;color:var(--chalk-dim)}
  .bracket{display:flex;gap:44px;overflow-x:auto;padding:6px 6px 14px;min-height:240px}
  .col{--rc:var(--chalk);display:flex;flex-direction:column;min-width:244px;flex:0 0 auto}
  .rc0{--rc:var(--cyan)} .rc1{--rc:var(--green)} .rc2{--rc:var(--yellow)} .rc3{--rc:var(--orange)} .rc4{--rc:var(--pink)} .rc5{--rc:var(--purple)}
  .colhead{font-size:25px;letter-spacing:.04em;text-align:center;color:var(--rc)}
  .colsub{font-size:14px;color:var(--chalk-dim);text-align:center;margin-bottom:12px}
  .colbody{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:22px}
  .match{width:226px;margin-right:18px}
  .mcap{font-size:14px;color:var(--chalk-dim);height:20px;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .match.playing .mcap{color:var(--chalk)}
  .mbody{position:relative;height:84px}
  .mbody::before{content:"";position:absolute;right:0;top:42px;height:42px;width:2px;background:var(--rc);filter:url(#roughV)}
  .mbody::after{content:"";position:absolute;right:-18px;top:62px;width:18px;height:2px;background:var(--rc);filter:url(#rough)}
  .slot{position:relative;height:42px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:0 6px 6px}
  .slot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--rc);filter:url(#rough)}
  .slot .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:20px;min-width:0}
  .slot.win .nm{color:var(--yellow)}
  .slot.lose{opacity:.45}
  .slot.lose .nm,.slot.gone .nm{text-decoration:line-through}
  .slot.gone{opacity:.5}
  .slot.empty .nm{color:var(--chalk-dim)}
  .slot.sw{cursor:pointer;outline:2px dashed var(--pink);outline-offset:1px;border-radius:8px}
  .slot.sw:hover{background:rgba(255,126,182,.2)}
  .slot.sel{background:rgba(255,216,77,.28);outline:2px solid var(--yellow)}
  .match.ghost{opacity:.4}
  .match.playing .mbody{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--rc) 55%,transparent))}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--chalk)}
  .dot.kirmizi{background:var(--t-red)} .dot.mavi{background:var(--t-blue)} .dot.beyaz{background:var(--t-white)}
  .champ{--rc:var(--yellow)}
  .champ .colbody{align-items:center;justify-content:center;text-align:center;gap:8px}
  .trophy{color:var(--yellow);filter:drop-shadow(0 0 10px rgba(255,216,77,.55))} .trophy.ghost{color:var(--chalk-dim);opacity:.5;filter:none}
  .trophy svg{width:78px;height:78px}
  .champname{font-size:30px;color:var(--yellow);overflow-wrap:anywhere;max-width:230px}
  .empty.big{margin:30px 10px;color:var(--chalk-dim);font-size:22px;text-align:center}

  /* Onay penceresi */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px;z-index:50}
  .dlg{background:#244640;border:3px solid var(--pink);border-radius:14px;padding:22px;max-width:450px;width:100%;box-shadow:0 20px 60px #000a}
  .dlg h3{margin:0 0 8px;font-weight:400;font-size:29px;letter-spacing:.03em;color:var(--yellow)}
  .dlg p{margin:0 0 18px;overflow-wrap:anywhere}
  .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1e2a29;border:2px solid var(--cyan);border-radius:12px;padding:10px 16px;z-index:60;max-width:92vw}
  .toast.err{border-color:var(--danger);color:var(--danger)}

  /* Sadece izleme modu (?view=1) */
  .view .admin,.view #teamForm,.view #controls,.view #formNote,.view #bracketBar{display:none!important}
  .view .layout{grid-template-columns:minmax(0,1fr)}
  .view .side{pointer-events:none}

  @media (max-width:900px){
    .board{padding:18px 14px 24px}
    .layout{grid-template-columns:minmax(0,1fr)}
    .tables{grid-template-columns:1fr}
    .scrollhint{display:block}
    .frame{margin:0;padding:8px;border-radius:0}
  }
</style>
</head>
<body>
<!-- Tebeşir efekti için hafif bozulma filtreleri -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="rough" x="-5%" y="-600%" width="110%" height="1300%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.06" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="roughV" x="-600%" y="-5%" width="1300%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.9" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="frame"><div class="board">

  <header class="top">
    <h1 id="mainTitle"><span class="em">🍻</span> <span class="grad">Beer Pong Turnuvası</span> <span class="em">🍻</span></h1>
    <div id="conn" class="conn"></div>
  </header>

  <section id="tablesSection" class="panel p-tables" hidden>
    <h2>Masalar</h2>
    <div id="tablesBox" class="tables"></div>
    <div id="queueBox" class="queue"></div>
  </section>

  <div class="layout">
    <aside class="panel p-teams">
      <h2>Takımlar <small id="teamCount"></small></h2>
      <form id="teamForm" class="form" autocomplete="off">
        <label>Takım adı
          <input id="nameInput" type="text" maxlength="40" required placeholder="örn. Kırmızı Kuğular">
        </label>
        <label>Zorluk
          <input id="lvlInput" type="number" min="1" max="10" step="1" inputmode="numeric" required placeholder="1-10">
        </label>
        <button class="btn primary" type="submit">Takımı ekle</button>
      </form>
      <p id="formMsg" class="msg" role="alert"></p>
      <p id="formNote" class="note"></p>
      <ul id="teamList" class="teams"></ul>
      <div id="controls"></div>
    </aside>

    <section class="panel p-board bracketPanel">
      <h2>Turnuva tablosu</h2>
      <div id="bracketBar" class="bar" hidden></div>
      <div class="legend">Takımın yanındaki renkli sayı = <b>zorluk seviyesi</b>:
        <span class="lvl sm" style="--lv:1">1</span> kolay
        <span class="lvl sm" style="--lv:5">5</span>
        <span class="lvl sm" style="--lv:10">10</span> zor</div>
      <p class="scrollhint">Diğer turlar için tabloyu yana kaydır →</p>
      <div id="board" class="bracket"></div>
    </section>
  </div>

</div></div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="dlg">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <div class="actions">
      <button type="button" id="dlgCancel" class="btn">Vazgeç</button>
      <button type="button" id="dlgOk" class="btn primary"></button>
    </div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';

/* ================= Ayarlar ================= */
const TABLES = [
  {key:'kirmizi', label:'Kırmızı Masa'},
  {key:'mavi',    label:'Mavi Masa'},
  {key:'beyaz',   label:'Beyaz Masa'}
];
const DIFF_ROUNDS = 2;   // 1. ve 2. tur zorluğa göre, sonrası rastgele
const MODE_LABEL = {close:'Benzer seviyeler eşleşsin', balanced:'Güçlü ↔ zayıf eşleşsin'};
const VIEW = new URLSearchParams(location.search).has('view');
if (VIEW) document.body.classList.add('view');

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID()
  : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const blankState = () => ({teams:[], matches:[], t:{status:'setup', current_round:0, pair_mode:'close', champion:null}});
// Zorluk rozeti (her takımın yanında)
const lv = (d, full) => `<span class="lvl ${full ? 'full' : 'sm'}" style="--lv:${d}" title="Zorluk seviyesi: ${d}">${full ? 'Zorluk ' + d : d}</span>`;

/* ================= Saf mantık (eşleştirme) ================= */
function shuffle(a){
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

// list içinden çiftler üretir. Tek sayıda takım varsa biri dışarıda kalır.
// 1-2. tur: zorluğa göre (close: komşu seviyeler, balanced: güçlü-zayıf). 3. tur ve sonrası: rastgele.
function makePairs(list, round, mode){
  let l = shuffle(list);
  if (round <= DIFF_ROUNDS) {
    l.sort((a, b) => a.difficulty - b.difficulty);            // kararlı sıralama; eşit seviyelerde rastgele
    if (l.length % 2 === 1) {
      let k = Math.floor(l.length / 2);
      if (mode !== 'balanced') {                              // toplam seviye farkını en az bırakan takımı dışarıda bırak
        let bestCost = Infinity;
        for (let x = 0; x < l.length; x++) {
          const rest = l.filter((_, i) => i !== x); let c = 0;
          for (let i = 0; i + 1 < rest.length; i += 2) c += Math.abs(rest[i].difficulty - rest[i + 1].difficulty);
          if (c < bestCost) { bestCost = c; k = x; }
        }
      }
      l.splice(k, 1);
    }
    if (mode === 'balanced') {
      const o = [];
      for (let i = 0; i < l.length / 2; i++) o.push(l[i], l[l.length - 1 - i]);
      l = o;
    }
  } else if (l.length % 2 === 1) {
    l.pop();
  }
  const pairs = [];
  for (let i = 0; i + 1 < l.length; i += 2) pairs.push([l[i], l[i + 1]]);
  return pairs;
}

const newRow = (round, slot, a, b) => ({round, slot, team_a:a, team_b:b, winner:null, status:'waiting', table_name:null, is_bye:false, walkover:false});
const byeRow = (round, slot, id) => ({round, slot, team_a:id, team_b:null, winner:id, status:'done', table_name:null, is_bye:true, walkover:false});

// 1. tur: bütün eşleşmeler birden kurulur. Tek sayıysa rastgele bir takım bay geçer.
function buildRound(pool, round, mode){
  const list = shuffle(pool);
  const bye = list.length % 2 === 1 ? list.pop() : null;
  const rows = makePairs(list, round, mode).map(([a, b], i) => newRow(round, i, a.id, b.id));
  if (bye) rows.push(byeRow(round, rows.length, bye.id));
  return rows;
}
function countRounds(n){ let r = 0; while (n > 1) { n = Math.ceil(n / 2); r++; } return r; }
function pairLabel(round, mode){
  if (round > DIFF_ROUNDS) return 'rastgele eşleşme';
  return mode === 'balanced' ? 'güçlü ↔ zayıf' : 'seviyeye göre';
}
function roundName(i, total){
  if (i === total) return 'FİNAL';
  if (i === total - 1) return 'YARI FİNAL';
  return i + '. TUR';
}

/* ================= Veri katmanı ================= */
const MATCH_DEFAULTS = {team_a:null, team_b:null, winner:null, status:'waiting', table_name:null, is_bye:false, walkover:false};

function createLocalDb(){
  const KEY = 'beerpong-demo-v1';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || blankState(); } catch(e){ return blankState(); } };
  const write = d => localStorage.setItem(KEY, JSON.stringify(d));
  return {
    mode: 'local',
    async load(){ return read(); },
    async addTeam(name, difficulty){
      const d = read(); const t = {id:uid(), name, difficulty, is_deleted:false, created_at:new Date().toISOString()};
      d.teams.push(t); write(d); return t;
    },
    async deleteTeam(id){ const d = read(); d.teams = d.teams.filter(t => t.id !== id); write(d); },
    async updateTeam(id, p){ const d = read(); Object.assign(d.teams.find(t => t.id === id) || {}, p); write(d); },
    async insertMatches(list){
      const d = read(); const rows = list.map(m => Object.assign({id:uid()}, MATCH_DEFAULTS, m));
      d.matches.push(...rows); write(d); return rows;
    },
    async updateMatch(id, p){ const d = read(); Object.assign(d.matches.find(m => m.id === id) || {}, p); write(d); },
    async clearMatches(){ const d = read(); d.matches = []; write(d); },
    async updateTournament(p){ const d = read(); Object.assign(d.t, p); write(d); },
    async reset(){                                   // her şeyi sil: takımlar + maçlar + sonuçlar
      const d = read();
      d.t = Object.assign(d.t, {status:'setup', current_round:0, champion:null});
      d.matches = []; d.teams = []; write(d);
    },
    subscribe(cb){ window.addEventListener('storage', e => { if (e.key === KEY) cb(); }); }
  };
}

function createSupabaseDb(url, key){
  const sb = window.supabase.createClient(url, key);
  const chk = r => { if (r.error) throw new Error(r.error.message); return r.data; };
  return {
    mode: 'supabase',
    async load(){
      const [teams, matches, t] = await Promise.all([
        sb.from('teams').select('*').order('created_at'),
        sb.from('matches').select('*').order('round').order('slot'),
        sb.from('tournament').select('*').eq('id', 1).maybeSingle()
      ]);
      let trn = chk(t);
      if (!trn) trn = chk(await sb.from('tournament').upsert({id:1}).select().single());
      return {teams: chk(teams), matches: chk(matches), t: trn};
    },
    async addTeam(name, difficulty){ return chk(await sb.from('teams').insert({name, difficulty}).select().single()); },
    async deleteTeam(id){ chk(await sb.from('teams').delete().eq('id', id)); },
    async updateTeam(id, p){ chk(await sb.from('teams').update(p).eq('id', id)); },
    async insertMatches(list){ return chk(await sb.from('matches').insert(list).select()); },
    async updateMatch(id, p){ chk(await sb.from('matches').update(p).eq('id', id)); },
    async clearMatches(){ chk(await sb.from('matches').delete().not('id', 'is', null)); },
    async updateTournament(p){ chk(await sb.from('tournament').update(Object.assign({updated_at:new Date().toISOString()}, p)).eq('id', 1)); },
    async reset(){
      chk(await sb.from('tournament').update({status:'setup', current_round:0, champion:null}).eq('id', 1));
      chk(await sb.from('matches').delete().not('id', 'is', null));
      chk(await sb.from('teams').delete().not('id', 'is', null));
    },
    subscribe(cb){ sb.channel('bp-live').on('postgres_changes', {event:'*', schema:'public'}, cb).subscribe(); }
  };
}

async function patchMatch(id, p){ await db.updateMatch(id, p); const m = S.matches.find(x => x.id === id); if (m) Object.assign(m, p); }
async function patchTeam(id, p){ await db.updateTeam(id, p); const t = T(id); if (t) Object.assign(t, p); }

async function act(fn){
  busy++;
  try { await fn(); }
  catch (e) {
    console.error(e); toast(e.message || String(e), true);
    try { S = await db.load(); } catch (_) {}
  }

  }
}
function scheduleReload(){
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async () => {
    if (busy) { dirty = true; return; }
    try { S = await db.load(); render(); } catch (e) { console.error(e); }
  }, 250);
}

/* ================= Turnuva akışı ================= */
// Tur bekleme yok: bir masa boşalınca, sırada maç yoksa kazanıp bekleyen takımlar hemen eşleştirilip o masaya atanır.
const rm = r => S.matches.filter(m => m.round === r);
const maxRound = () => S.matches.reduce((a, m) => Math.max(a, m.round), 0);
const idsIn = ms => { const s = new Set(); ms.forEach(m => { if (m.team_a) s.add(m.team_a); if (m.team_b) s.add(m.team_b); }); return s; };
const busyTables = () => S.matches.filter(m => m.status === 'playing' || (m.status === 'waiting' && !m.is_bye)).length;

// r. tura giren takımların durumu: placed (maça yerleşmiş), pool (kazanıp rakip bekleyen), F (henüz kazananı belli olmayanlar)
function roundInfo(r){
  if (r <= 1) { const placed = idsIn(rm(1)); return {placed, pool:[], F:0, T:placed.size}; }
  const p = roundInfo(r - 1);
  const done = rm(r - 1).filter(m => m.status === 'done');
  const F = Math.max(0, Math.ceil(p.T / 2) - done.length);
  const placed = idsIn(rm(r));
  const pool = done.filter(m => m.winner).map(m => T(m.winner)).filter(t => t && !t.is_deleted && !placed.has(t.id));
  return {placed, pool, F, T: placed.size + pool.length + F};
}

async function scheduleRound(r){
  const {pool, F, placed} = roundInfo(r);
  if (!pool.length) return false;
  const cur = rm(r);
  const hasBye = cur.some(m => m.is_bye);
  const working = shuffle(pool);
  const needBye = (placed.size + working.length + F) % 2 === 1 && !hasBye;
  const free = Math.max(0, TABLES.length - busyTables());
  let bye = null;

  if (F === 0) {                                  // herkes geldi
    if (working.length % 2 === 1) {
      if (placed.size === 0 && working.length === 1) return false;     // tek takım kaldı: şampiyon
      bye = working.splice(Math.floor(Math.random() * working.length), 1)[0];
    }
  } else if (needBye && cur.length === 0 && working.length >= 2 && free > 0) {
    // tur tek sayıda takımla oynanacak: bay'ı baştan, henüz gelmeyenler dahil herkes arasında eşit şansla seç
    const idx = Math.floor(Math.random() * (working.length + F));
    if (idx < working.length) bye = working.splice(idx, 1)[0];
  }

  let slot = cur.reduce((a, m) => Math.max(a, m.slot), -1) + 1;
  const rows = makePairs(working, r, S.t.pair_mode).slice(0, free).map(([a, b]) => newRow(r, slot++, a.id, b.id));
  if (bye) rows.push(byeRow(r, slot++, bye.id));
  if (!rows.length) return false;
  S.matches.push(...await db.insertMatches(rows));
  return true;
}

async function assignTables(){
  const used = new Set(S.matches.filter(m => m.status === 'playing').map(m => m.table_name));
  const free = TABLES.map(t => t.key).filter(k => !used.has(k));
  const waiting = S.matches.filter(m => m.status === 'waiting' && !m.is_bye).sort((a, b) => a.round - b.round || a.slot - b.slot);
  const n = Math.min(free.length, waiting.length);
  for (let i = 0; i < n; i++) await patchMatch(waiting[i].id, {status:'playing', table_name:free[i]});
  return n > 0;
}

async function progress(){
  if (S.t.status !== 'running') return;
  for (let guard = 0; guard < 80; guard++) {
    let changed = false;
    // 1) Silinen takımın maçı: rakip hükmen kazanır
    for (const m of S.matches.slice()) {
      if (m.status === 'done' || m.is_bye) continue;
      const a = T(m.team_a), b = T(m.team_b);
      if ((a && a.is_deleted) || (b && b.is_deleted)) {
        const w = (a && !a.is_deleted) ? a.id : ((b && !b.is_deleted) ? b.id : null);
        await patchMatch(m.id, {status:'done', winner:w, walkover:true, table_name:null});
        changed = true;
      }
    }
    // 2) Boş masalara sıradaki maçlar
    if (await assignTables()) changed = true;
    // 3) Boş masa kaldıysa, kazanıp bekleyenlerden yeni maçlar kur
    for (let r = 2; r <= maxRound() + 1; r++) if (await scheduleRound(r)) changed = true;
    if (!changed) break;
  }
  // 4) Şampiyon belli mi?
  if (S.matches.length && S.matches.every(m => m.status === 'done')) {
    const waiting = [];
    for (let r = 2; r <= maxRound() + 1; r++) waiting.push(...roundInfo(r).pool);
    if (waiting.length <= 1) await patchT({status:'finished', champion: waiting[0] ? waiting[0].id : null});
  }
}

async function createDraft(){

  if (pool.length < 2) throw new Error('En az 2 takım gerekli.');

}
async function startTournament(){
  if (!S.matches.length) await createDraft();
  await patchT({status:'running', current_round:1});
  editMode = false; sel = null;

}

async function onWinner(mid, tid){
  const m = S.matches.find(x => x.id === mid), t = T(tid);
  if (!m || !t || m.status !== 'playing') return;
  const ok = await confirmDlg({
    title: 'Kazananı onayla',
    text: `“${t.name}” (zorluk ${t.difficulty}) kazandı olarak kaydedilsin mi?`,
    okText: 'Evet, kazandı'
  });
  if (!ok) return;
  await act(async () => {
    const fresh = S.matches.find(x => x.id === mid);
    if (!fresh || fresh.status !== 'playing') return;
    await patchMatch(mid, {status:'done', winner:tid, table_name:null});
    await progress();
  });
}

async function onDelete(id){
  const t = T(id); if (!t) return;
  const st = S.t.status;
  let extra = '';
  if (st === 'running') {
    const live = S.matches.find(x => (x.status === 'playing' || x.status === 'waiting') && (x.team_a === id || x.team_b === id));
    if (live) extra = (live.status === 'playing' ? ` Şu anda bir masada oynuyor (${tableLabel(live.table_name)}).` : '') +
      ' Takım turnuvadan tamamen elenir ve rakibi otomatik kazanmış sayılır.';
    else extra = ' Takım turnuvadan çıkarılır.';
  } else if (isDraft()) extra = ' Eşleşme önizlemesi silinir, yeniden oluşturman gerekir.';
  const ok = await confirmDlg({
    title: 'Takımı sil',
    text: `“${t.name}” takımını silmek istediğine emin misin?${extra}`,
    okText: 'Evet, sil', danger: true
  });
  if (!ok) return;
  await act(async () => {
    if (st === 'setup') {
      if (S.matches.length) { await db.clearMatches(); S.matches = []; sel = null; editMode = false; }
      await db.deleteTeam(id);
      S.teams = S.teams.filter(x => x.id !== id);
    } else {
      await patchTeam(id, {is_deleted:true});
      await progress();
    }
  });
}

async function onReset(){
  const ok = await confirmDlg({
    title: 'Her şeyi sıfırla',
    text: 'Tüm takımlar, eşleşmeler ve sonuçlar silinir. Bu işlem geri alınamaz.',
    okText: 'Evet, hepsini sil', danger: true
  });
  if (!ok) return;
  await act(async () => { await db.reset(); S = await db.load(); editMode = false; sel = null; });
}

/* --- Takım yer değiştirme --- */
function swappable(m){
  if (S.t.status === 'finished') return false;
  if (m.status === 'waiting' && !m.is_bye) return true;
  if (m.is_bye && m.team_a) {   // bay geçen takım henüz sonraki turda bir maça yerleşmediyse
    return !rm(m.round + 1).some(x => x.team_a === m.team_a || x.team_b === m.team_a);
  }
  return false;
}
function canSwap(){
  const per = {};
  S.matches.forEach(m => { if (swappable(m)) per[m.round] = (per[m.round] || 0) + 1; });
  return Object.values(per).some(c => c >= 2);
}
const editing = () => !VIEW && (isDraft() || (S.t.status === 'running' && editMode && canSwap()));

function onSwapPick(mid, tid){
  if (!sel) { sel = {mid, tid}; render(); return; }
  if (sel.mid === mid) { sel = (sel.tid === tid) ? null : {mid, tid}; render(); return; }
  const a = sel; sel = null;
  act(() => swapTeams(a.mid, a.tid, mid, tid));
}
async function swapTeams(m1id, t1, m2id, t2){
  const m1 = S.matches.find(x => x.id === m1id), m2 = S.matches.find(x => x.id === m2id);
  if (!m1 || !m2 || m1.round !== m2.round || !swappable(m1) || !swappable(m2)) throw new Error('Bu iki takım şu an yer değiştiremez.');
  const repl = (m, from, to) => { const p = {}; if (m.team_a === from) p.team_a = to; else p.team_b = to; if (m.is_bye) p.winner = to; return p; };
  await patchMatch(m1.id, repl(m1, t1, t2));
  await patchMatch(m2.id, repl(m2, t2, t1));
  if (S.t.status === 'running') await progress();
}

function teamState(t){
  if (S.t.status === 'setup') return null;
  if (S.t.champion === t.id) return {k:'champ', txt:'ŞAMPİYON'};
  const m = S.matches.filter(x => x.team_a === t.id || x.team_b === t.id).sort((a, b) => b.round - a.round)[0];
  if (!m) return {k:'out', txt:'Elendi'};
  if (m.status === 'playing') return {k:'play', txt:'Oynuyor · ' + tableLabel(m.table_name)};
  if (m.status === 'waiting') return {k:'wait', txt:'Sırada'};
  if (m.winner === t.id) return S.t.status === 'finished' ? {k:'out', txt:'Elendi'} : {k:'adv', txt: m.is_bye ? 'Bay · rakip bekliyor' : 'Rakip bekliyor'};
  return {k:'out', txt:'Elendi'};
}

  const alive = aliveTeams();
  const byRound = new Map();
  S.matches.forEach(m => { if (!byRound.has(m.round)) byRound.set(m.round, []); byRound.get(m.round).push(m); });
  const rounds = [...byRound.keys()].sort((a, b) => a - b);

  if (!rounds.length && alive.length < 2) {
    box.innerHTML = '<p class="empty big">Eşleşmeleri görmek için en az 2 takım ekle.</p>';
    return;
  }

  const cols = [];
  rounds.forEach(r => cols.push({round:r, matches:byRound.get(r).slice().sort((a, b) => (a.is_bye - b.is_bye) || (a.slot - b.slot)), missing:0}));
  let next, rno;
  if (rounds.length) {
    const last = cols[cols.length - 1];
    const expected = Math.ceil(roundInfo(last.round).T / 2);
    last.missing = Math.max(0, expected - last.matches.length);     // henüz kurulmamış eşleşmeler
    next = expected; rno = last.round + 1;
  } else { next = alive.length; rno = 1; }
  while (next > 1) {                       // henüz oynanmamış turlar: boş tebeşir çizgileri
    const c = Math.ceil(next / 2);
    cols.push({round:rno, ghost:{count:c, bye:next % 2 === 1}});
    next = c; rno++;
  }
  const total = cols.length;

  let html = cols.map((c, i) => {
    let inner;
    if (c.matches) {
      const real = c.matches.filter(m => !m.is_bye).map(matchHTML).join('');
      const ghosts = Array.from({length:c.missing}, () => ghostHTML(false)).join('');
      const byes = c.matches.filter(m => m.is_bye).map(matchHTML).join('');
      inner = real + ghosts + byes;
    } else {
      inner = Array.from({length:c.ghost.count}, (_, k) => ghostHTML(c.ghost.bye && k === c.ghost.count - 1)).join('');
    }
    const cls = i === total - 1 ? 'champ' : 'rc' + (i % 6);
    return `<div class="col ${cls}"><div class="colhead">${roundName(i + 1, total)}</div>
      <div class="colsub">${pairLabel(c.round, S.t.pair_mode)}</div><div class="colbody">${inner}</div></div>`;
  }).join('');

  const champ = S.t.status === 'finished' && S.t.champion ? T(S.t.champion) : null;
  html += `<div class="col champ"><div class="colhead">ŞAMPİYON</div><div class="colsub">&nbsp;</div>
    <div class="colbody">${champ
      ? `<div class="trophy">${ICON_CUP}</div><div class="champname">${esc(champ.name)}</div>${lv(champ.difficulty, true)}`
      : `<div class="trophy ghost">${ICON_CUP}</div>`}</div></div>`;
  box.innerHTML = html;
}

function render(){
  if (sel) { const m = S.matches.find(x => x.id === sel.mid); if (!m || !swappable(m)) sel = null; }
  if (S.t.status !== 'running' && !isDraft()) { editMode = false; sel = null; }
  renderConn(); renderTeams(); renderControls(); renderBar(); renderTables(); renderBoard();
  const locked = S.t.status !== 'setup' || S.matches.length > 0;
  $('#teamForm').querySelectorAll('input,button').forEach(el => { el.disabled = locked; });
  $('#formNote').textContent = isDraft()
    ? 'Eşleşmeler hazır. Takım eklemek için önce “Vazgeç”e bas.'
    : (locked ? 'Turnuva başladığı için yeni takım eklenemez.' : '');
}

/* ================= Onay penceresi + bildirim ================= */
function confirmDlg({title, text, okText = 'Evet', danger = false}){
  return new Promise(resolve => {
    const m = $('#modal'), ok = $('#dlgOk'), cancel = $('#dlgCancel');
    $('#dlgTitle').textContent = title;
    $('#dlgText').textContent = text;
    ok.textContent = okText;
    ok.className = 'btn ' + (danger ? 'danger solid' : 'primary');
    m.hidden = false;
    (danger ? cancel : ok).focus();
    const onKey = e => { if (e.key === 'Escape') done(false); };
    const done = v => {
      m.hidden = true; ok.onclick = cancel.onclick = m.onclick = null;
      document.removeEventListener('keydown', onKey); resolve(v);
    };
    ok.onclick = () => done(true);
    cancel.onclick = () => done(false);
    m.onclick = e => { if (e.target === m) done(false); };
    document.addEventListener('keydown', onKey);
  });
}

let toastTimer;
function toast(msg, isErr){
  const el = $('#toast');
  el.textContent = msg; el.className = 'toast' + (isErr ? ' err' : ''); el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, isErr ? 6000 : 2500);
}

/* ================= Olaylar ================= */
function bind(){
  $('#teamForm').addEventListener('submit', e => {
    e.preventDefault();
    if (VIEW) return;
    const msg = $('#formMsg'); msg.textContent = '';
    const name = $('#nameInput').value.replace(/\s+/g, ' ').trim();
    const lvl = Number($('#lvlInput').value);
    if (!name) { msg.textContent = 'Takım adı boş olamaz.'; return; }
    if (!Number.isInteger(lvl) || lvl < 1 || lvl > 10) { msg.textContent = 'Zorluk seviyesi 1 ile 10 arasında bir tam sayı olmalı.'; return; }
    const key = s => s.toLocaleLowerCase('tr');
    if (aliveTeams().some(t => key(t.name) === key(name))) { msg.textContent = 'Bu isimde bir takım zaten var.'; return; }
    act(async () => {
      const t = await db.addTeam(name, lvl);
      S.teams.push(t);
      $('#nameInput').value = ''; $('#lvlInput').value = '';
      $('#nameInput').focus();
    });
  });

  document.addEventListener('click', e => {
    if (VIEW) return;
    const t = e.target;
    const del = t.closest('[data-del]'); if (del) { onDelete(del.dataset.del); return; }
    const win = t.closest('[data-win]'); if (win) { const [mid, tid] = win.dataset.win.split(':'); onWinner(mid, tid); return; }
    const sw = t.closest('[data-sw]'); if (sw) { const [mid, tid] = sw.dataset.sw.split(':'); onSwapPick(mid, tid); return; }
    const btn = t.closest('button[id]'); if (!btn) return;
    switch (btn.id) {
      case 'startBtn': onStart(); break;
      case 'previewBtn': onPreview(); break;
      case 'beginBtn': onBegin(); break;
      case 'reshuffleBtn': onReshuffle(); break;
      case 'cancelDraftBtn': onCancelDraft(); break;
      case 'resetBtn': onReset(); break;
      case 'editBtn': editMode = !editMode; sel = null; render(); break;
    }
  });

  document.addEventListener('change', e => {
    if (VIEW) return;
    if (e.target.id === 'modeSel') { const v = e.target.value; act(() => patchT({pair_mode:v})); }
  });
}

/* ================= Başlangıç ================= */
async function init(){
  const cfg = window.APP_CONFIG || {};
  if (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY) {
    if (window.supabase && window.supabase.createClient) db = createSupabaseDb(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    else { db = createLocalDb(); toast('Supabase kütüphanesi yüklenemedi, demo modundasın.', true); }
  } else {
    db = createLocalDb();
  }
  bind();
  try { S = await db.load(); }
  catch (e) { console.error(e); toast('Veri yüklenemedi: ' + e.message, true); }
  render();
  try {
    db.subscribe(() => { if (busy) { dirty = true; } else scheduleReload(); });
  } catch (e) { console.error(e); }
}

window.__BP = {buildRound, makePairs, countRounds};   // test için
window.addEventListener('DOMContentLoaded', init);
})();
</script>
